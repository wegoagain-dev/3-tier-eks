# ClusterSecretStore tells External Secrets Operator how to connect to AWS Secrets Manager
# This is a cluster-wide resource that can be used by ExternalSecrets in any namespace
apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata:
  name: aws-secrets-manager
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  provider:
    aws:
      service: SecretsManager
      region: eu-west-2
      auth:
        jwt:
          serviceAccountRef:
            name: external-secrets
            namespace: external-secrets

---
# ExternalSecret fetches database credentials from AWS Secrets Manager
# and creates a regular Kubernetes Secret that pods can use
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: database-secret
  namespace: 3-tier-app-eks
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: database-secret
    creationPolicy: Owner
  data:
    - secretKey: DATABASE_URL
      remoteRef:
        key: devops_quiz_db_secret
        property: DATABASE_URL

---
# ExternalSecret for RDS endpoint used by init containers
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: rds-endpoint-secret
  namespace: 3-tier-app-eks
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: rds-endpoint-secret
    creationPolicy: Owner
  data:
    - secretKey: RDS_ENDPOINT
      remoteRef:
        key: devops_quiz_db_secret
        property: RDS_ENDPOINT
