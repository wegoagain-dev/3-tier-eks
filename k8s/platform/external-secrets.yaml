# External Secrets Operator
#
# ESO syncs secrets from AWS Secrets Manager to Kubernetes.
# This keeps secrets out of Git while still using GitOps.
#
# How secrets flow:
# AWS Secrets Manager → ESO (via IRSA) → Kubernetes Secret → Application Pod
#
# IRSA Setup:
# 1. Terraform creates IAM role with Secrets Manager permissions
# 2. This Application creates ServiceAccount with role annotation
# 3. ESO pod assumes role and reads secrets from AWS
# 4. ESO creates Kubernetes Secrets that apps can use

apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: external-secrets
  namespace: argocd
  annotations:
    # Deploy early - applications need secrets
    argocd.argoproj.io/sync-wave: "-2"
spec:
  project: default
  source:
    repoURL: https://charts.external-secrets.io
    chart: external-secrets
    targetRevision: 2.0.0
    helm:
      values: |
        installCRDs: true
        serviceAccount:
          create: true
          name: external-secrets
          annotations:
            # Links to IAM role created by Terraform
            # ESO uses this to access AWS Secrets Manager
            eks.amazonaws.com/role-arn: arn:aws:iam::373317459404:role/devops-quiz-external-secrets-role
  destination:
    server: https://kubernetes.default.svc
    namespace: external-secrets
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
