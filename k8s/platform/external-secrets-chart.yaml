# External Secrets Operator Helm Chart
#
# This Application installs the ESO Helm chart which provides the CRDs
# (ClusterSecretStore, ExternalSecret, etc.) and the operator

apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: external-secrets-chart
  namespace: argocd
  annotations:
    # Deploy first to provide CRDs
    argocd.argoproj.io/sync-wave: "-2"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://charts.external-secrets.io
    chart: external-secrets
    targetRevision: 2.0.0
    helm:
      values: |
        installCRDs: true
        serviceAccount:
          create: true
          name: external-secrets
          annotations:
            # Links to IAM role created by Terraform
            # ESO uses this to access AWS Secrets Manager
            eks.amazonaws.com/role-arn: arn:aws:iam::373317459404:role/devops-quiz-external-secrets-role
  destination:
    server: https://kubernetes.default.svc
    namespace: external-secrets
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 5m
