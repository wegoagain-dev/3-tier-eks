# ExternalSecret fetches database credentials from AWS Secrets Manager
# and creates a regular Kubernetes Secret that pods can use
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: database-secret
  namespace: 3-tier-app-eks
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: database-secret
  data:
    - secretKey: DATABASE_URL
      remoteRef:
        key: devops_quiz_db_secret
        property: DATABASE_URL
---
# ExternalSecret for RDS endpoint used by the ExternalName service
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: rds-endpoint-secret
  namespace: 3-tier-app-eks
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: rds-endpoint-secret
  data:
    - secretKey: RDS_ENDPOINT
      remoteRef:
        key: devops_quiz_db_secret
        property: RDS_ENDPOINT
