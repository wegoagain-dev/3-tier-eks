services:
  # ---------------------------------------------------------------------------
  # Database Service (PostgreSQL)
  # ---------------------------------------------------------------------------
  db:
    image: postgres:14-alpine
    container_name: devops_db
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=devops_learning
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - app-network

  # ---------------------------------------------------------------------------
  # Backend Service (Flask)
  # ---------------------------------------------------------------------------
  backend:
    build: ./backend
    container_name: devops_backend
    ports:
      - "8000:8000"
    environment:
      - FLASK_APP=run.py
      - FLASK_DEBUG=1
      - DB_USER=postgres
      - DB_PASSWORD=password
      - DB_HOST=db
      - DB_PORT=5432
      - DB_NAME=devops_learning
      - ALLOWED_ORIGINS=http://localhost:8080,http://localhost:3000
    depends_on:
      db:
        condition: service_healthy
    networks:
      - app-network

  # ---------------------------------------------------------------------------
  # Migration Runner (Runs once to seed DB)
  # ---------------------------------------------------------------------------
  migration:
    build: ./backend
    container_name: devops_migration
    command: ./migrate.sh
    environment:
      - DB_USER=postgres
      - DB_PASSWORD=password
      - DB_HOST=db
      - DB_PORT=5432
      - DB_NAME=devops_learning
    depends_on:
      db:
        condition: service_healthy
    networks:
      - app-network

  # ---------------------------------------------------------------------------
  # Frontend Service (React + Nginx)
  # ---------------------------------------------------------------------------
  frontend:
    build: ./frontend
    container_name: devops_frontend
    ports:
      - "8080:80"
    environment:
      # Internal Docker DNS: connecting to 'backend' service on port 8000
      - BACKEND_URL=http://backend:8000
    depends_on:
      - backend
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  postgres_data:
