apiVersion: batch/v1
kind: Job
metadata:
  name: database-migration
  namespace: 3-tier-app-eks
spec:
  # Auto-delete job 5 minutes after finishing | try 3 times on failure
  ttlSecondsAfterFinished: 300
  backoffLimit: 3

  template:
    spec:
      initContainers:
        - name: wait-for-db
          image: busybox
          command:
            [
              "sh",
              "-c",
              'until nc -z -v -w30 postgres-db 5432; do echo "Waiting for DB..."; sleep 2; done;',
            ]
      containers:
        - name: migration
          image: localhost/3-tier-eks-backend:latest
          imagePullPolicy: Never
          command: ["/bin/bash", "-c", "./migrate.sh"]

          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: database-secret
                  key: DATABASE_URL
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "256Mi"
              cpu: "200m"

      restartPolicy: Never
      activeDeadlineSeconds: 300
