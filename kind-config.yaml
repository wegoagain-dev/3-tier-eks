kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
  # The Brain: Runs API Server, Etcd, Scheduler
  - role: control-plane
    kubeadmConfigPatches:
      - |
        kind: InitConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "ingress-ready=true"

  # The Workers: Where your actual React/Flask apps will live
  - role: worker
  - role: worker
